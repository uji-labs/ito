[package]
name = "ito"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A declarative terminal UI kit in Lua, shipped as embeddable source"
build = "build.rs"
include = ["Cargo.toml", "build.rs", "src/**/*.rs", "lua/ito/**/*.lua", "LICENSE", "README.md"]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
crossterm = "0.29"
mlua = { version = "0.12", features = ["serde", "async"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[features]
module = ["mlua/module"]
lua51 = ["mlua/lua51"]
lua52 = ["mlua/lua52"]
lua53 = ["mlua/lua53"]
lua54 = ["mlua/lua54"]
lua55 = ["mlua/lua55"]
luajit = ["mlua/luajit"]
luajit52 = ["mlua/luajit52"]
vendored = ["mlua/vendored"]
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
macro_use_extern_crate = "deny"
non_ascii_idents = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_clone = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
exit = "deny"
mem_forget = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
mutex_atomic = "deny"
rc_buffer = "deny"
clone_on_ref_ptr = "deny"
verbose_file_reads = "deny"
same_name_method = "deny"
empty_structs_with_brackets = "deny"
try_err = "deny"
unneeded_field_pattern = "deny"
large_stack_arrays = "deny"
