[package]
name = "ito-web"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "ito-web"
path = "src/main.rs"

[dependencies]
ito = { path = "..", features = ["canvas", "lua54", "vendored"] }
mlua = { version = "0.12", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
